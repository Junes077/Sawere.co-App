[package]
name = "sawere-legal-os"
version = "0.1.0"
description = "Sawere Legal OS — Windows desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-os = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "sawere-legal-os"
path = "src/main.rs"
